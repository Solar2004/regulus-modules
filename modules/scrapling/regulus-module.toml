# The manifest of the `scrapling` local module: the same shape as any `regulus-module.toml`
# (Regulus docs/03-modules.md). `src/main.rs` sends it when the core asks. The core names
# the module `<project>/scrapling@<version>` whatever the part before `@` says.
[module]
id             = "local/scrapling@0.1.0"
name           = "Scrapling"
requires_proto = "^1"

# A page through the Scrapling CLI, one value at a time: the URL arrives on `in`, the
# page's content leaves on `out`. A page that could not be fetched, answered with an HTTP
# status of 400 or more, or gave no content goes to `error` as "<url without its query>:
# <why>". The same ports as the built-in `web.fetch`, so one replaces the other.
[[node]]
type = "fetch"
name = "Scrapling fetch"

  [[node.port]]
  id          = "in"
  name        = "in"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id          = "out"
  name        = "out"
  capability  = "text@1"
  direction   = "output"
  kind        = "then"

  [[node.port]]
  id          = "error"
  name        = "error"
  capability  = "text@1"
  direction   = "output"
  kind        = "then"

  # http: a plain request that looks like a browser's (fast, no JavaScript).
  # browser: Scrapling's stealth browser, for pages that need JavaScript or block plain
  # requests.
  [[node.field]]
  id      = "mode"
  type    = "select"
  label   = "Mode"
  default = "http"
  options = ["http", "browser"]

  # What goes to `out`: the page as Markdown, its HTML, or its text.
  [[node.field]]
  id      = "format"
  type    = "select"
  label   = "Format"
  default = "markdown"
  options = ["markdown", "html", "text"]

  # Only what this CSS selector matches (every match). Empty: the whole page.
  [[node.field]]
  id      = "selector"
  type    = "text"
  label   = "CSS selector"
  default = ""

  # yes: drop navigation, hidden elements and other noise, for a reader that is a model.
  [[node.field]]
  id      = "main_content"
  type    = "select"
  label   = "Main content only"
  default = "no"
  options = ["no", "yes"]

  # Milliseconds one attempt may take, 1000 to 600000. A plain request is retried twice.
  [[node.field]]
  id      = "timeout_ms"
  type    = "number"
  label   = "Timeout (ms)"
  default = 30000

  # http://user:password@host:port, or `secret:<name>`. Empty: no proxy.
  [[node.field]]
  id      = "proxy"
  type    = "text"
  label   = "Proxy"
  default = ""

  # Wait until this CSS selector is on the page.
  [[node.field]]
  id      = "wait_selector"
  type    = "text"
  label   = "Wait for selector"
  default = ""
  when    = { field = "mode", equals = "browser" }

  # yes: wait until the page stops loading things.
  [[node.field]]
  id      = "network_idle"
  type    = "select"
  label   = "Wait for network idle"
  default = "no"
  options = ["no", "yes"]
  when    = { field = "mode", equals = "browser" }

  # yes: pass Cloudflare's challenge page when there is one.
  [[node.field]]
  id      = "solve_cloudflare"
  type    = "select"
  label   = "Solve Cloudflare"
  default = "no"
  options = ["no", "yes"]
  when    = { field = "mode", equals = "browser" }

  # yes: drive the Chrome installed on this computer instead of the browser that
  # `scrapling install` downloads.
  [[node.field]]
  id      = "real_chrome"
  type    = "select"
  label   = "Use installed Chrome"
  default = "no"
  options = ["no", "yes"]
  when    = { field = "mode", equals = "browser" }

  # The Scrapling CLI: `scrapling` if it is on the core's PATH, else its full path, such
  # as ~/.venvs/scrapling/bin/scrapling. Several words work too: `uvx scrapling`.
  [[node.field]]
  id      = "command"
  type    = "text"
  label   = "Scrapling command"
  default = "scrapling"
